[package]
name = "dswp"
version = "0.1.0"
edition = "2021"
description = "Fast disk cleanup CLI for Windows"
authors = ["DiskSweeperPro Contributors"]
license = "Apache-2.0"

[[bin]]
name = "dswp"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
walkdir = "2"
chrono = "0.4"
anyhow = "1"
colored = "2"
rayon = "1"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
